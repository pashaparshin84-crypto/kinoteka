services:
  db:
    image: postgres:16-alpine
    container_name: filmotheka_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-filmotheka_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-filmotheka_pass}
      POSTGRES_DB: ${POSTGRES_DB:-filmotheka_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-filmotheka_user} -d ${POSTGRES_DB:-filmotheka_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: filmotheka_api
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-filmotheka_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-filmotheka_pass}
      POSTGRES_DB: ${POSTGRES_DB:-filmotheka_db}
      POSTGRES_PORT: 5432
      POSTGRES_HOST: db
      SERVER_PORT: 8080
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: